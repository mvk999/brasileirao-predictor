  descricao: >-
    O repositório começou como um projeto educacional. O README inicial
    descrevia o plano de importar partidas históricas, calcular estatísticas,
    treinar modelos e, futuramente, gerar previsões probabilísticas. Esses
    itens eram objetivos, não funcionalidades prontas.

