  conclusao: >-
    Dixon-Coles B quase não alterou as decisões da variante A: acurácia, F1 macro e Brier ficaram
    praticamente iguais; log loss melhorou em média apenas 0,0009. As variantes A e B previram
    respectivamente 1 e 3 empates nos 5.320 jogos, com 0 e 1 acertos. C elevou F1 macro médio
    de 0,253 para 0,287 e recall de visitante de 0,071 para 0,175, mas reduziu recall do mandante
    de 0,962 para 0,905. Não melhorou de forma consistente log loss ou Brier e reconheceu somente
    2 dos 1.458 empates reais (2/8 previsões). O ganho de F1 de C veio principalmente da classe A,
    não da classe D. Os resultados não confirmam melhora consistente na previsão de empates.
    As 14 temporadas incluem 2010–2015 e 2017–2024; 2016 foi excluída por incompletude.
    Desvios são descritivos e não intervalos de confiança: folds sequenciais compartilham dados de treino.
    O artefato local preserva métricas completas, parâmetros e probabilidades por fold.

estado_atual:
  entregue:
    - CSV de 2020 a 2024 preparado e validado, com 1.900 jogos.
    - Base com 12 features históricas por partida.
    - Primeiro modelo treinado e comparado com uma referência simples.
    - Diagnóstico de erros de 2023 e previsões retrospectivas de 2024 gerados localmente.
    - Experimento de empates reproduzível, sem trocar o modelo principal.
    - Ablation Poisson/Dixon-Coles/decaimento com 14 folds walk-forward e gráfico de calibração.
  limites:
    - O ganho de acurácia em 2024 foi pequeno, de 47,4% para 48,2%.
    - O modelo previu vitória do mandante em 323 dos 380 jogos de 2024.
    - Em 2023, reconheceu somente 5 dos 98 empates reais.
    - O melhor resultado exploratório para empates ainda precisa de validação em dados novos.
    - O Poisson independente não previu nenhum empate pela regra de maior probabilidade em 2023.
    - A regra de até cinco empates por rodada aumentou a revocação de D, mas reduziu acertos em H e A.
    - Incluir todos os anos desde 2006 reduziu o F1 macro médio em 2018–2022 e não corrigiu empates.
    - Pesos maiores para anos recentes elevaram o F1 médio de 2018–2022, mas não sustentaram melhora em 2023 e 2024.
    - No Dixon-Coles, o decaimento elevou F1 macro principalmente por vitórias visitantes; a recuperação de empates permaneceu residual.
    - Ainda não há fluxo para montar features de uma partida futura.
    - A fonte processada cobre apenas até a temporada de 2024.
  proximos_passos:
    - Investigar força dos clubes entre temporadas e variáveis que diferenciem empates com novas validações temporais.
    - Reunir uma temporada nova para confirmar se a melhora em empates se repete.
    - Atualizar a fonte de dados e gerar features para partidas não disputadas.
    - Criar uma interface somente após validar o fluxo de previsão futura.

