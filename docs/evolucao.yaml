experimento_empates:
  protocolo: >-
    Treino 2020–2021 e escolha do limite em 2022 pelo maior F1 macro;
    retreino 2020–2022 e avaliação em 2023. A temporada 2024 não foi usada.
    O limite é escolhido separadamente para cada conjunto de features.
  features: >-
    Diferença absoluta de pontos por jogo, diferença absoluta de gols
    estimados e interação entre essa diferença e o total estimado de gols.
    Tudo deriva de médias de partidas anteriores à partida avaliada.
  interpretacao: >-
    O limite de 0,35 da referência elevou o F1 macro de 0,331 para 0,357,
    com 10 dos 98 empates reconhecidos. As features adicionais com limite
    de 0,34 elevaram o F1 macro a 0,370 e reconheceram 18 empates, mas a
    acurácia ficou em 0,489 ante 0,492 da referência. O ganho é exploratório:
    uma única temporada de validação e 2023 já havia sido inspecionada.
    O modelo usado pelo projeto não foi substituído.
  referencia_padrao: {limiar: 'maior probabilidade', acuracia: 0.4921052632, f1_macro: 0.3311164757, log_loss: 1.0568007836, previstos_d: 7, corretos_d: 5, precisao_d: 0.7142857143, revocacao_d: 0.0510204082}
  referencia_ajustada: {limiar: 0.35, acuracia: 0.4973684211, f1_macro: 0.3574879850, log_loss: 1.0568007836, previstos_d: 21, corretos_d: 10, precisao_d: 0.4761904762, revocacao_d: 0.1020408163}
  equilibrio_ajustado: {limiar: 0.34, acuracia: 0.4894736842, f1_macro: 0.3696428571, log_loss: 1.0546383493, previstos_d: 42, corretos_d: 18, precisao_d: 0.4285714286, revocacao_d: 0.1836734694}
  troca_limiares:
    - {limiar: 0.25, previstos_d: 304, corretos_d: 76, falsos_d: 228, acuracia: 0.2947368421}
    - {limiar: 0.30, previstos_d: 126, corretos_d: 36, falsos_d: 90, acuracia: 0.4315789474}
    - {limiar: 0.35, previstos_d: 21, corretos_d: 10, falsos_d: 11, acuracia: 0.4973684211}

experimento_poisson:
  protocolo: >-
    Para cada jogo, são usados somente resultados com data anterior. Ataque
    e vulnerabilidade defensiva de cada clube usam gols marcados/sofridos
    em relação à média da liga; dados de temporadas mais antigas recebem
    peso menor. A intensidade de encolhimento foi escolhida em 2022 pelo
    menor log loss; 2023 foi usado para comparação. 2024 não foi usado.
  metodo: >-
    Poisson independente para gols da casa e de fora, com vantagem de mando
    embutida nas médias de gols da liga. A distribuição Skellam fornece as
    probabilidades de A, D e H. Não foi aplicada a correção de Dixon-Coles.
  prior_escolhido: 5
  referencia: {acuracia: 0.4921052632, f1_macro: 0.3311164757, log_loss: 1.0568007836, d_corretos: 5, d_previstos: 7, h_corretos: 163, a_corretos: 19}
  poisson: {acuracia: 0.4684210526, f1_macro: 0.3108974359, log_loss: 1.0326129501, d_corretos: 0, d_previstos: 0, h_corretos: 150, a_corretos: 28}
  conclusao: >-
    A probabilidade média de empate do Poisson em 2023 ficou próxima da
    frequência real, mas empate nunca foi a classe mais provável. O log loss
    melhorou; acurácia, F1 macro e acertos de mandante pioraram. O modelo
    principal não foi substituído. A melhoria de empate sem perda de H e A
    ainda não foi demonstrada.

experimento_rodadas:
  protocolo: >-
    Todas as partidas de uma rodada usam somente jogos anteriores à data do
    primeiro jogo da rodada. A diferença máxima entre taxas de gols foi
    escolhida em 2022 pelo maior F1 macro; o prior de cinco jogos já havia
    sido escolhido em 2022 no experimento Poisson. Entre os jogos elegíveis, no
    máximo cinco com menor diferença recebem a classe D; os demais recebem
    H ou A conforme a maior taxa de gols. A avaliação usa 2023, sem 2024.
  limite_gols: 0.20
  teto_empates: 5
  empates_exatamente_iguais_2023: 0
  empates_reais_2023: 98
  max_empates_reais_rodada_2023: 6
  rodadas_acima_teto_2023: 1
  rodadas_acima_teto_numeros_2023: [10]
  referencia: {acuracia: 0.4684210526, f1_macro: 0.3108974359, log_loss: 1.0332466318, d_corretos: 0, d_previstos: 0, h_corretos: 150, a_corretos: 28}
  regra: {acuracia: 0.4552631579, f1_macro: 0.3805377219, log_loss: 1.0332466318, d_corretos: 30, d_previstos: 101, h_corretos: 126, a_corretos: 17}
  conclusao: >-
    A igualdade exata das taxas não ocorreu em 2023. Com diferença máxima
    de 0,20 gol e teto cinco, a regra encontrou 30 empates, mas criou 71
    falsos empates e reduziu acertos em H e A. A rodada 10 teve seis empates
    reais; o teto de cinco impede reconhecer todos nessa rodada. A regra
    não substituiu o modelo principal. O resultado é exploratório, pois 2023
    já havia sido inspecionado e ainda falta uma temporada nova.

experimento_historico_longo:
  protocolo: >-
    A mesma regressão logística e os mesmos 12 atributos foram aplicados a
    18 temporadas completas de 2006 a 2024, sem 2016. Cada clube reinicia o
    histórico de cinco jogos a cada temporada. Para cada ano de 2018 a 2022,
    o modelo foi treinado somente com temporadas anteriores, comparando
    janelas de três, cinco, dez e todas as temporadas disponíveis. 2023 e
    2024 foram avaliados retrospectivamente após essa comparação.
  temporadas_completas: 18
  partidas: 6840
  ausencias: >-
    A fonte começa em 2003, então 2000–2002 não existem nela. 2003–2005
    tiveram 24 ou 22 clubes e ficaram fora da comparação homogênea de 20
    clubes. A fonte local tem 379 jogos em 2016, por isso a temporada foi
    excluída em vez de completar dados sem evidência.
  metricas_medias_2018_2022:
    recent_3: {acuracia: 0.48, f1_macro: 0.2925000679, log_loss: 1.0492096328}
    recent_5: {acuracia: 0.4763157895, f1_macro: 0.2664938560, log_loss: 1.0407900632}
    recent_10: {acuracia: 0.47, f1_macro: 0.2455590879, log_loss: 1.0392796559}
    all: {acuracia: 0.47, f1_macro: 0.2368760955, log_loss: 1.0386149504}
  validacao_2023:
    recent_3: {acuracia: 0.4921052632, f1_macro: 0.3311164757, log_loss: 1.0568007836, empates_corretos: 5, empates_previstos: 7}
    all: {acuracia: 0.4631578947, f1_macro: 0.2430490379, log_loss: 1.0473999211, empates_corretos: 0, empates_previstos: 0}
  avaliacao_2024:
    recent_3: {acuracia: 0.4842105263, f1_macro: 0.3398252639, log_loss: 1.0277097891, empates_corretos: 13, empates_previstos: 33}
    all: {acuracia: 0.4789473684, f1_macro: 0.2737529583, log_loss: 1.0331838886, empates_corretos: 1, empates_previstos: 1}
  conclusao: >-
    Mais temporadas reduziram o log loss médio em 2018–2022, mas pioraram
    acurácia e F1 macro; o treino com três temporadas teve o maior F1 médio.
    Em 2023, usar todo o histórico previu zero empates, ante sete previsões
    e cinco acertos com três temporadas. Não há evidência para substituir
    o treino principal por todo o histórico. 2023 e 2024 já haviam sido
    inspecionados; falta uma temporada nova para confirmação independente.

experimento_pesos_recencia:
  protocolo: >-
    Foram reutilizadas as 18 temporadas completas e os mesmos 12 atributos.
    Cada partida anterior ao ano avaliado recebeu peso proporcional a
    0,5 elevado à idade em anos dividida pela meia-vida; os pesos foram
    normalizados para média 1 e aplicados à regressão logística. As meias-vidas
    de 1, 2, 4 e 8 anos foram comparadas no teste temporal de 2018–2022.
    2023 e 2024 serviram somente para leitura retrospectiva do resultado.
  metricas_medias_2018_2022:
    recent_3: {acuracia: 0.48, f1_macro: 0.2925000679, log_loss: 1.0492096328}
    all: {acuracia: 0.47, f1_macro: 0.2368760955, log_loss: 1.0386149504}
    weighted_hl_1: {acuracia: 0.4810526316, f1_macro: 0.304360, log_loss: 1.052921}
    weighted_hl_2: {acuracia: 0.4810526316, f1_macro: 0.279703, log_loss: 1.044229}
    weighted_hl_4: {acuracia: 0.4710526316, f1_macro: 0.248906, log_loss: 1.040208}
    weighted_hl_8: {acuracia: 0.4710526316, f1_macro: 0.243637, log_loss: 1.038980}
  validacao_2023:
    recent_3: {acuracia: 0.4921052632, f1_macro: 0.3311164757, log_loss: 1.0568007836, empates_corretos: 5, empates_previstos: 7, h_corretos: 163, a_corretos: 19}
    weighted_hl_1: {acuracia: 0.4815789474, f1_macro: 0.328363, log_loss: 1.057892, empates_corretos: 5, empates_previstos: 11, h_corretos: 158, a_corretos: 20}
  avaliacao_2024:
    recent_3: {acuracia: 0.4842105263, f1_macro: 0.3398252639, log_loss: 1.0277097891, empates_corretos: 13, empates_previstos: 33, h_corretos: 159, a_corretos: 12}
    weighted_hl_1: {acuracia: 0.4868421053, f1_macro: 0.334013, log_loss: 1.031079, empates_corretos: 11, empates_previstos: 22, h_corretos: 162, a_corretos: 12}
  conclusao: >-
    Meia-vida de um ano foi a melhor entre as quatro no F1 macro médio de
    2018–2022 (0,304 ante 0,293 com três temporadas recentes), mas o log loss
    médio piorou. Em 2023, o F1 e a acurácia ficaram abaixo da janela de três
    anos; em 2024, a acurácia subiu de 48,4% para 48,7%, mas F1 e empates
    corretos caíram. Não há ganho consistente para substituir o modelo
    principal. 2023 e 2024 já haviam sido inspecionados.

experimento_dixon_coles:
  protocolo: >-
    Walk-forward expansivo nas temporadas completas disponíveis, com pelo menos quatro anos de treino.
    A estima ataque e defesa por máxima verossimilhança Poisson; B acrescenta tau de Dixon-Coles;
    C acrescenta pesos exponenciais exp(-xi * dias desde o corte). As forças de ataque obedecem
    média(log(ataque)) = 0. rho usa limites viáveis para manter tau dos quatro placares positivos,
    limitado a [-0,5; 0,5]. Em cada fold, xi é selecionado por log loss numa temporada interna
    mais recente do treino, entre meias-vidas de 90, 180, 365 e 730 dias; depois o modelo C é
    reajustado em todo o treino externo. Testes usam somente argmax, sem regra forçada para empate.
  folds: [2010, 2011, 2012, 2013, 2014, 2015, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  jogos_teste: 5320
  observacao_variancia: Desvio padrão descritivo entre temporadas; folds são sequenciais e não independentes.
  variantes:
    A: Poisson independente, rho=0, pesos uniformes.
    B: Poisson com tau de Dixon-Coles, rho estimado, pesos uniformes.
    C: Variante B com pesos temporais e xi escolhido dentro do treino de cada fold.
  meia_vida_selecionada_contagem:
    90: 0
    180: 2
    365: 2
    730: 10
